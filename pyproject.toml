[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-logger"
version = "0.1.0"
description = "Dual-write structured logging library with 100% local data custody and Google Cloud Observability streaming."
readme = "README.md"
authors = [
    { name = "Umut Öçgüder", email = "umutocgdr@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
google = [
    "google-cloud-logging>=3.10.0",
    "google-cloud-error-reporting>=1.10.0",
    "google-auth>=2.28.0",
]

[project.scripts]
log-cli = "main:main"
